name: OTA Update

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        # --environment production pulls the server-side EAS environment
        # variables (EXPO_PUBLIC_SUPABASE_URL/ANON_KEY, etc.) at bundle time.
        # Without it, CI has no .env (gitignored) so those inline as empty and
        # the published OTA ships with Supabase unconfigured, breaking sign-in.
        run: eas update --branch production --environment production --message "${MESSAGE:-Manual OTA update}" --non-interactive
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MESSAGE: ${{ github.event.head_commit.message }}
